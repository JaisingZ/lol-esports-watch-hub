name: Sync official Worlds data

on:
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Commit changed data and publish (main only; leave off for review)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Shared with pages.yml to serialize publication workflows for the same ref.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (github.ref != 'refs/heads/main' || inputs.publish != true))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Updates this disposable checkout, then checks/builds exactly that candidate.
      # This job has no write credentials, commit step, Pages artifact or deploy job.
      - name: Collect candidate without publishing
        run: npm run sync:official
      - run: npm run check
      - run: npm run build
      - name: Record review result
        run: echo 'Core official schedule validation and candidate build passed. Review any source warnings above. Nothing was committed or deployed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record review failure
        if: failure()
        run: echo 'Candidate collection, validation or build failed. Repository and published data were not changed.' >> "$GITHUB_STEP_SUMMARY"

  refresh:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Collect and validate official data
        id: collect
        run: npm run sync:official
      - name: Validate changed candidate and independent parser tests
        if: steps.collect.outputs.changed == 'true'
        run: npm run check
      - name: Build changed candidate
        if: steps.collect.outputs.changed == 'true'
        run: npm run build
      - name: Commit changed data only
        if: steps.collect.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/data public/team-logos
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'chore: 同步世界赛官方赛程与录像关联'
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN commits do not trigger pages.yml: publish in this same run.
      - name: Upload the checked build
        if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Record unchanged result
        if: steps.collect.outputs.changed != 'true'
        run: echo 'Official data unchanged. No commit or deployment.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record failed update
        if: failure()
        run: echo 'Update failed. Collection/validation/build failures do not commit data; push failure does not deploy. A deployment failure after a successful data commit requires retry.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.ref == 'refs/heads/main' && needs.refresh.outputs.changed == 'true'
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish this run's checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Record deployment failure
        if: failure()
        run: echo 'Checked data was committed but Pages deployment failed. The previous successful site remains; rerun this failed deployment job.' >> "$GITHUB_STEP_SUMMARY"
